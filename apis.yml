aid: request
name: Request Finance
description: >-
  Request Finance is a crypto and fiat invoicing, payments, and payroll platform
  that lets businesses issue invoices, accept payments in crypto and fiat, pay
  contractors and employees, and manage accounts payable and receivable. Its
  Accounts Payable and Receivable (AP/AR) REST API lets developers programmatically
  create and send invoices, run off-chain and on-chain payroll payments, track
  invoice status without polling blockchains or bank accounts, manage organizations
  and clients, and download invoice PDFs. Invoices are settled through the Request
  Network protocol across many EVM chains and stablecoins, with crypto-to-fiat
  settlement via banking partners. The API uses Bearer authentication (API keys for
  quick starts, OAuth 2.0 / OIDC via Auth0 for production), real-time webhooks with
  HMAC-signed payloads, and a Sepolia testnet sandbox. Request Finance is backed by
  Balderton Capital.
